["mir-THYpe / BRAF / pTERT","Brazilian molecular test for indeterminate thyroid nodules. Analyses microRNA + BRAF V600E + pTERT mutations. 96% negative predictive value. All your markers were NEGATIVE → 4% malignancy risk. BRAF V600E when positive = >98% papillary carcinoma. pTERT = aggressive behaviour. Neither detected in your sample."],

["ApoB","One ApoB molecule per atherogenic particle (LDL, VLDL, Lp(a)). Direct particle count — many experts consider it the single best CV risk predictor, superior to LDL-C which only measures cholesterol content, not particle number. Optimal <65."],

function render(){
